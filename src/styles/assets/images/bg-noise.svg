<svg 
  viewBox="0 0 300 300"
  xmlns='http://www.w3.org/2000/svg'
  >

  <filter id='noiseFilter'>
    <feTurbulence 
      baseFrequency='5' 
      numOctaves='1' 
      stitchTiles='stitch' />
    <feDisplacementMap in="sourceGraphic" scale="10"/>
  </filter>

  <rect
    width='100%' 
    height='100%' 
    filter='url(#noiseFilter)'

    />
</svg>

